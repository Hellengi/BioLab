<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="toolbar" class="toolbar">
  <div class="toolbar-left">
    <div id="timeControlGroup" class="time-control">
      <div id="timeDisplay" class="toolbar-display time-display" tabindex="0" role="button" aria-label="Reset simulation speed to 1x" aria-describedby="timeTooltip">
        <div class="time-display-top">
          <span id="timeYearsDays" class="time-years-days">0y 0d</span>
          <span id="speedLabel" class="speed-value">1.00&#xD7;</span>
        </div>
        <span id="timeClock" class="time-clock">00:00:00.000</span>
        <span id="timeTooltip" class="app-tooltip app-tooltip--time" role="tooltip" aria-hidden="true">
          <span class="app-tooltip-row">
            <span>Tick</span>
            <span id="timeTooltipTick">0</span>
          </span>
        </span>
      </div>
      <input id="timeSlider" type="range" min="0" max="100" step="0.1" value="50"
             title="Simulation speed: 0.01× … 100×">
      <button id="pauseBtn" type="button" class="btn btn-outline-secondary pause-btn"
              title="Pause / Resume">Pause</button>
    </div>

    <button id="resetBtn" type="button" class="btn btn-secondary reset-btn">Reset</button>
    <div id="benchmarkToolbarIndicator" class="toolbar-display benchmark-toolbar-indicator hidden" aria-live="polite">
      <span class="benchmark-toolbar-copy">
        <span class="benchmark-toolbar-label">Benchmark running</span>
        <span id="benchmarkToolbarTitle" class="benchmark-toolbar-title"></span>
      </span>
      <span id="benchmarkToolbarProgress" class="benchmark-toolbar-progress"></span>
    </div>
  </div>

  <div class="toolbar-center"></div>



  <div class="toolbar-right">
    <span id="fpsLabel" class="fps-badge" aria-live="polite">
      <span class="metrics-live">
        <span class="metric-column metric-column--fps">
          <span class="metric-name">fps</span>
          <span id="fpsValue" class="metric-value">0</span>
        </span>
        <span class="metric-divider">/</span>
        <span class="metric-column metric-column--tps">
          <span class="metric-name">tps</span>
          <span id="tpsValue" class="metric-value">0</span>
        </span>
      </span>
      <span class="metrics-paused">Paused</span>
    </span>
    <button id="sidebarToggleBtn" type="button" class="btn btn-outline-secondary"
            title="Cell control">Control</button>
  </div>
</div>
</body>
</html>
