<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<div th:fragment="tab-creation" id="tabCreate" class="tab-panel hidden">

  <div class="panel-header-row">
    <h2>Cell Creation</h2>
    <div class="panel-header-actions">
      <button id="exportCellBtn" class="icon-btn" title="Save cell template">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <button id="importCellBtn" class="icon-btn" title="Load cell template">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="sticky-preview">
    <div class="selected-cell-preview-wrap create-preview-wrap" id="createPreviewWrap">
      <div class="preview-triptych">
        <div class="preview-zone preview-zone--left preview-zone--modes">
          <div id="createCellModeHint" class="preview-mode-badge preview-mode-badge--create-off">
            <span class="preview-mode-badge-bg"></span>
            <span class="preview-mode-badge-text">Placing OFF</span>
          </div>
          <div class="preview-control-grid preview-control-grid--create" aria-label="Create cell preview controls">
            <button id="placeCellModeBtn" type="button" class="icon-btn preview-action-btn preview-action-btn--inline" title="Place on the field" aria-label="Place on the field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <circle cx="12" cy="12" r="3"/>
                <line x1="12" y1="2" x2="12" y2="6"/>
                <line x1="12" y1="18" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="6" y2="12"/>
                <line x1="18" y1="12" x2="22" y2="12"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="preview-zone preview-zone--center">
          <canvas id="createCellPreviewCanvas" width="160" height="160"></canvas>
        </div>

        <div class="preview-zone preview-zone--right">
          <div id="createPreviewLayerControls" class="preview-segmented preview-layer-controls" aria-label="Create preview render layers">
            <span class="preview-segmented-frame"></span>
            <button type="button" class="preview-layer-btn active" data-preview-layer-count="1">Organelles</button>
              <button type="button" class="preview-layer-btn active" data-preview-layer-count="2">Membrane</button>
              <button type="button" class="preview-layer-btn active" data-preview-layer-count="3">Shading</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="settings-section">
    <div class="settings-section-header">
      <span class="settings-section-label">Information / Organelles</span>
    </div>
    <div id="createInfoScopeControls" class="info-scope-controls" aria-label="Create cell information scope">
      <button type="button" class="info-scope-btn active" data-create-info-scope="general">General</button>
      <button type="button" class="info-scope-btn" data-create-info-scope="nucleus">Nucleus</button>
      <button type="button" class="info-scope-btn" data-create-info-scope="cytosol">Cytosol</button>
      <button type="button" class="info-scope-btn" data-create-info-scope="membrane">Membrane</button>
      <button type="button" class="info-scope-btn" data-create-info-scope="chloroplast">Chloroplast</button>
      <button type="button" class="info-scope-btn" data-create-info-scope="lysosome">Lysosome</button>
    </div>
    <div id="createInfoGrid" class="cell-info-grid"></div>
  </div>

</div>

</body>
</html>
