spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/biolab
    username: postgres
    password: password
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false

simulation:
  tick-rate-ms: 10
  broadcast-fps: 60
  diameter: 800

  time:
    min-speed-factor: 0.01
    max-speed-factor: 100.0
    min-temperature-celsius: -20.0
    normal-temperature-celsius: 20.0
    max-temperature-celsius: 60.0

  environment:
    max-viscosity: 4.0
    max-gravity: 0.5
    base-mutation-chance: 0
    max-mutation-chance: 0.25
    rare-mutation-chance: 0.006
    medium-density: 1.0
    buoyancy-strength: 1.0

  light:
    max-turbidity-attenuation: 0.018
    global-cycle-enabled: false
    local-sources-enabled: true
    orbit-speed-max-radians-per-tick: 0.01
    falloff-factor: 400.0
    grid-step: 8
    cell-fluorescence-max-brightness: 0.02

  collision:
    cell-restitution: 1.0
    dead-cell-restitution: 0.05
    position-slop: 0.01
    correction-percent: 0.8

  cell:
    base-radius: 6.0
    start-energy: 40.0
    energy-to-mass-factor: 1.0
    energy-to-radius-factor: 4.0
    energy-to-division-impulse-factor: 4.0
    energy-decay-per-tick: 0.05
    low-energy-threshold: 10.0
    dead-lifetime-ticks: 80
    start:
      initial: 20
      min: 0
      max: 100
      step: 1
    offset-range: 20.0
    nucleoid-mass-factor: 45.0
    nucleoid-area-factor: 18.0
    nucleoid-energy-consumption: 0.012
    nucleoid-div-energy-cost: 5.0
    cytosol-mass-factor: 1.0
    cytosol-area-factor: 0.58
    cytosol-energy-consumption-factor: 0.0007
    cytosol-div-energy-cost-factor: 0.02
    cytosol-gfp-consumption-factor: 0.0009
    cytosol-color-weight: 1.0
    membrane-mass-factor: 2.2
    membrane-area-factor: 0.32
    membrane-energy-consumption-factor: 0.0012
    membrane-div-energy-cost-factor: 0.025
    membrane-base-opacity: 0.095
    membrane-melanin-opacity-factor: 0.42
    membrane-melanin-protection-factor: 3.2
    membrane-melanin-energy-consumption-factor: 0.003
    chloroplast-mass-factor: 6.0
    chloroplast-area-factor: 4.0
    chloroplast-energy-consumption-factor: 0.0014
    chloroplast-div-energy-cost-factor: 0.12
    chlorophyll-absorb-factor: 2.4
    carotenoid-absorb-factor: 0.42
    carotenoid-protection-factor: 2.8
    max-photosynthesis-factor: 0.025
    photosynthesis-energy-yield: 0.82
    cp-photo-damage-factor: 0.006
    cp-damage-leak-threshold: 0.55
    cp-damage-leak-factor: 0.035
    lysosome-mass-factor: 4.5
    lysosome-area-factor: 4.7
    lysosome-energy-consumption-factor: 0.006
    lysosome-div-energy-cost-factor: 0.09
    lysosome-digest-rate-factor: 0.85
    lysosome-base-digest-yield: 1.0
    lysosome-digest-cost-factor: 0.085
    lysosome-transport-speed-factor: 0.78
    lysosome-leak-threshold: 0.55
    lysosome-leak-damage-factor: 0.006
    lysosome-capture-damage-threshold: 0.65
    lysosome-repair-share: 0.12
    lysosome-repair-energy-cost: 1.2
    flagellum-mass-factor: 2.2
    flagellum-area-factor: 0.75
    flagellum-div-energy-cost-factor: 0.05
    flagellum-base-thrust-factor: 0.045
    flagellum-energy-cost-factor: 0.018
    flagellum-length-to-radius-factor: 4.0
    flagellum-repair-share: 0.10
    flagellum-repair-energy-cost: 1.35
    membrane-repair-share: 0.16
    membrane-repair-energy-cost: 1.8
    base-cell-opacity: 0.12
    pigment-cell-opacity-factor: 0.22
    cell-photo-damage-factor: 0.00035
    cell-death-damage-threshold: 1.0
    cell-div-damage-max: 0.35
    repair-capacity-factor: 0.004
    cp-repair-share: 0.62
    cell-repair-share: 0.38
    cp-repair-energy-cost: 1.4
    cell-repair-energy-cost: 2.2
    div-damage-transfer-factor: 0.5
    dead-cell-food-energy-per-mass: 0.08
    dead-cell-food-min-pieces: 3
    dead-cell-food-max-pieces: 7
    dead-cell-food-scatter-radius-factor: 0.8
  food:
    base-radius: 2.0
    max-spawn-multiplier: 20.0
    min-energy: 10.0
    max-energy: 20.0
    start: 300
  controls:
    time:
      initial: 50
      min: 0
      max: 100
      step: 1
    food-spawn-intensity:
      initial: 50
      min: 0
      max: 100
      step: 1
    viscosity:
      initial: 40
      min: 0
      max: 100
      step: 1
    gravity:
      initial: 0
      min: 0
      max: 100
      step: 1
    radiation:
      initial: 20
      min: 0
      max: 100
      step: 1
    global-light:
      initial: 0
      min: 0
      max: 100
      step: 1
    turbidity:
      initial: 0
      min: 0
      max: 100
      step: 1
    global-light-cycle-min:
      initial: 0
      min: 0
      max: 100
      step: 1
    global-light-cycle-period:
      initial: 15
      min: 1
      max: 300
      step: 1
      scale: logarithmic
    light-source-count:
      initial: 1
      min: 1
      max: 6
      step: 1
    light-source-start-angle:
      initial: 0
      min: 0
      max: 315
      step: 45
    light-source-brightness:
      initial: 100
      min: 0
      max: 200
      step: 1
    light-source-orbit-radius:
      initial: 100
      min: 0
      max: 100
      step: 1
    light-source-orbit-speed:
      initial: 0
      min: -100
      max: 100
      step: 1
      scale: logarithmic

  genome:
    division-threshold:
      initial: 50.0
      min: 30.0
      max: 100.0
      step: 1.0
    division-impulse:
      initial: 2.0
      min: 0.5
      max: 6.0
      step: 0.01
    division-angle:
      initial: 0.0
      min: 0.0
      max: 179.0
      step: 1.0
    start-nucleus-damage:
      initial: 0.0
      min: 0.0
      max: 1.0
      step: 0.01
    start-cytosol-damage:
      initial: 0.0
      min: 0.0
      max: 1.0
      step: 0.01
    cytosol-area:
      initial: 60.0
      min: 20.0
      max: 200.0
      step: 0.1
    cytosol-density:
      initial: 1.2
      min: 0.35
      max: 3.5
      step: 0.01
    elasticity:
      initial: 0.25
      min: 0.05
      max: 1.0
      step: 0.01
    gfp-enabled-initial: false
    gfp:
      initial: 0.0
      min: 0.0
      max: 100.0
      step: 1.0
    melanin-enabled-initial: false
    melanin-percent:
      initial: 0.0
      min: 0.0
      max: 100.0
      step: 1.0
    chloroplast-enabled-initial: false
    chloroplast-amount:
      initial: 8.0
      min: 1.0
      max: 24.0
      step: 1.0
    chlorophyll:
      initial: 55.0
      min: 15.0
      max: 100.0
      step: 1.0
    carotenoids:
      initial: 22.0
      min: 0.0
      max: 100.0
      step: 1.0
    start-cp-damage:
      initial: 0.0
      min: 0.0
      max: 1.0
      step: 0.01
    start-membrane-damage:
      initial: 0.0
      min: 0.0
      max: 1.0
      step: 0.01
    start-lysosome-damage:
      initial: 0.0
      min: 0.0
      max: 1.0
      step: 0.01
    start-flagellum-damage:
      initial: 0.0
      min: 0.0
      max: 1.0
      step: 0.01
    lysosome-enabled-initial: true
    lysosome-amount:
      initial: 3.0
      min: 1.0
      max: 6.0
      step: 1.0
    lysosome-enzyme-activity:
      initial: 30.0
      min: 15.0
      max: 100.0
      step: 1.0
    flagellum-enabled-initial: false
    flagellum-count:
      initial: 1.0
      min: 1.0
      max: 2.0
      step: 1.0
    flagellum-length:
      initial: 1.8
      min: 1.0
      max: 4.0
      step: 0.01
    flagellum-motor-power:
      initial: 30.0
      min: 15.0
      max: 100.0
      step: 1.0
    flagellum-pair-spread-angle:
      initial: 36.0
      min: 0.0
      max: 180.0
      step: 1.0
    flagellum-steering-asymmetry:
      initial: 0.0
      min: -100.0
      max: 100.0
      step: 1.0
      scale: logarithmic
    mutation:
      division-threshold: 2.0
      division-impulse: 0.25
      division-angle: 6.0
      cytosol-area: 4.0
      cytosol-density: 0.08
      elasticity: 0.04
      gfp: 8.0
      melanin-percent: 8.0
      chloroplast-amount: 0.12
      chlorophyll: 8.0
      carotenoids: 8.0
      lysosome-amount: 0.12
      lysosome-enzyme-activity: 8.0
      flagellum-length: 0.12
      flagellum-motor-power: 8.0
      flagellum-pair-spread-angle: 4.0
      flagellum-steering-asymmetry: 8.0

  motion:
    cell-speed:
      initial: 0.0
      min: 0.0
      max: 20.0
      step: 0.1
    cell-direction:
      initial: 0.0
      min: 0.0
      max: 359.0
      step: 1.0


